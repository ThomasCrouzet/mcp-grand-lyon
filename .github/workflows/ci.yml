name: CI

on:
  push:
    branches: [main, master]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13"]
    steps:
      - uses: actions/checkout@v7
      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          python-version: ${{ matrix.python-version }}
          enable-cache: true
      - name: Sync (locked)
        run: uv sync --locked --all-extras --dev
      - name: Offline quality gate with evidence
        run: uv run --no-sync python scripts/verify_quality.py --artifact-dir "$RUNNER_TEMP/quality-evidence"
      - name: Upload quality evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: quality-python-${{ matrix.python-version }}
          path: ${{ runner.temp }}/quality-evidence
          include-hidden-files: true
          if-no-files-found: error

  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          python-version: "3.12"
          # Pas de cache ici : évite la course de clé avec quality (3.12).
          enable-cache: false
      - name: Build wheel + sdist
        run: uv build
      - name: Verify installed wheel through MCP stdio and CLI
        run: |
          set -euo pipefail
          wheels=(dist/*.whl)
          test "${#wheels[@]}" -eq 1
          uv run --no-project --python 3.12 python scripts/verify_wheel.py \
            --wheel "${wheels[0]}" --artifact-dir "$RUNNER_TEMP/wheel-evidence"
        env:
          UV_CONCURRENT_BUILDS: "1"
          UV_CONCURRENT_DOWNLOADS: "2"
          UV_CONCURRENT_INSTALLS: "2"
      - name: Upload protocol evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: wheel-protocol-evidence
          path: |
            ${{ runner.temp }}/wheel-evidence
            !${{ runner.temp }}/wheel-evidence/venv/**
          if-no-files-found: error
      - name: Upload distributions
        uses: actions/upload-artifact@v7
        with:
          name: dist
          path: dist/*

  gitleaks:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      # CLI en conteneur : aucun token GitHub ni licence requis (robuste aussi sur
      # les PR Dependabot dont le GITHUB_TOKEN est en lecture seule).
      - name: Gitleaks secret scan
        run: |
          docker run --rm -v "${{ github.workspace }}:/repo" \
            zricethezav/gitleaks:latest detect --source=/repo --redact --verbose
