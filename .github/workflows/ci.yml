name: CI

on:
  push:
    branches: [main, master]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        go-version: ["1.26.x", "1.27.x"]
    steps:
      - uses: actions/checkout@v7
      - name: Install Go
        uses: actions/setup-go@v7
        with:
          go-version: ${{ matrix.go-version }}
          cache: true
      - name: Download modules
        run: go mod download
      - name: Verify modules
        run: |
          go mod verify
          go mod tidy -diff
      - name: Check formatting
        run: |
          files="$(gofmt -l .)"
          if [ -n "$files" ]; then
            printf 'Files require gofmt:\n%s\n' "$files" >&2
            exit 1
          fi
      - name: Run vet
        run: go vet ./...
      - name: Run race-enabled tests
        env:
          GLMCP_ARTIFACT_DIR: ${{ runner.temp }}/quality-${{ matrix.go-version }}
          GLMCP_COVERAGE_DIR: ${{ runner.temp }}/coverage-${{ matrix.go-version }}
        run: make test
      - name: Check known vulnerabilities
        if: matrix.go-version == '1.27.x'
        run: go run golang.org/x/vuln/cmd/govulncheck@v1.9.0 ./...
      # Keep generated reports in runner temporary storage. Do not upload them.

  build:
    needs: quality
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - name: Install Go
        uses: actions/setup-go@v7
        with:
          go-version: "1.27.x"
          cache: true
      - name: Build host binary
        run: |
          mkdir -p "$RUNNER_TEMP/bin"
          CGO_ENABLED=0 go build -trimpath -o "$RUNNER_TEMP/bin/grand-lyon-mcp" ./cmd/grand-lyon-mcp
      - name: Verify host binary through MCP stdio and CLI
        env:
          GLMCP_ARTIFACT_DIR: ${{ runner.temp }}/installed-binary-evidence
          GLMCP_BINARY: ${{ runner.temp }}/bin/grand-lyon-mcp
        run: go test -count=1 ./tests/e2e

  gitleaks:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Scan committed content for secrets
        run: |
          docker run --rm -v "${{ github.workspace }}:/repo" \
            zricethezav/gitleaks:v8.30.1 detect --source=/repo --redact --verbose
