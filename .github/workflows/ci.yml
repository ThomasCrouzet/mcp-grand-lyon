name: CI

on:
  push:
    branches: [main, master]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13", "3.14", "3.15"]
    steps:
      - uses: actions/checkout@v7
      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          python-version: ${{ matrix.python-version }}
          enable-cache: true
      - name: Sync (locked)
        run: uv sync --locked --all-extras --dev
      - name: Cache mypy analysis
        uses: actions/cache@v6
        with:
          path: .mypy_cache
          key: mypy-ubuntu24.04-${{ runner.arch }}-${{ matrix.python-version }}-${{ hashFiles('uv.lock', 'pyproject.toml') }}-${{ hashFiles('src/**/*.py') }}
          restore-keys: |
            mypy-ubuntu24.04-${{ runner.arch }}-${{ matrix.python-version }}-${{ hashFiles('uv.lock', 'pyproject.toml') }}-
      - name: Offline quality gate with evidence
        run: uv run --no-sync python scripts/verify_quality.py --artifact-dir "$RUNNER_TEMP/quality-evidence"
      # Keep generated reports in runner temporary storage. Do not upload them.

  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          python-version: "3.12"
          # Prebuilt wheel downloads are faster than a separate cache transfer.
          enable-cache: false
      - name: Build wheel + sdist
        run: uv build
      - name: Verify installed wheel through MCP stdio and CLI
        run: |
          set -euo pipefail
          wheels=(dist/*.whl)
          test "${#wheels[@]}" -eq 1
          uv run --no-project --python 3.12 python scripts/verify_wheel.py \
            --wheel "${wheels[0]}" --artifact-dir "$RUNNER_TEMP/wheel-evidence"
        env:
          UV_CONCURRENT_BUILDS: "1"
          UV_CONCURRENT_DOWNLOADS: "2"
          UV_CONCURRENT_INSTALLS: "2"
      - name: Verify installed wheel setup
        run: |
          set -euo pipefail
          wheels=(dist/*.whl)
          test "${#wheels[@]}" -eq 1
          uv run --no-project --python 3.12 python scripts/verify_setup.py \
            --wheel "${wheels[0]}" --artifact-dir "$RUNNER_TEMP/setup-evidence"
        env:
          UV_CONCURRENT_BUILDS: "1"
          UV_CONCURRENT_DOWNLOADS: "2"
          UV_CONCURRENT_INSTALLS: "2"
      - name: Upload distributions
        uses: actions/upload-artifact@v7
        with:
          name: dist
          path: dist/*
          retention-days: 3

  gitleaks:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      # The container CLI needs no GitHub token or license.
      # This also works for Dependabot pull requests with a read-only token.
      - name: Gitleaks secret scan
        run: |
          docker run --rm -v "${{ github.workspace }}:/repo" \
            zricethezav/gitleaks:v8.30.1 detect --source=/repo --redact --verbose
