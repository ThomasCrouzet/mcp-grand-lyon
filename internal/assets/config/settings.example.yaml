version: 1
runtime:
  offline: false
  max_parallel_requests: 6
places:
  fuzzy_score_threshold: 72
network:
  connect_timeout_seconds: 5
  read_timeout_seconds: 20
  tool_timeout_seconds: 15
  verify_tls: true
journey_scoring:
  duration: 0.35
  reliability: 0.25
  disruptions: 0.15
  walking: 0.10
  availability: 0.10
  user_preference: 0.05
retention:
  briefing_max_age_days: 90
  briefing_max_count: 100
  velov_max_age_days: 30
  velov_max_count: 10000
